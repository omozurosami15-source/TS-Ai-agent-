<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#020604">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><title>TS Agent</title><link rel="stylesheet" href="app.css"></head>
<body>
<canvas id="rain"></canvas>
<div id="app">
  <header><div style="display:flex;align-items:center;gap:10px"><img src="icon-192.png" width="34" height="34" alt="" style="border-radius:50%;border:1px solid #00ff9c"><div class="glitch" data-t="TS-AGENT">TS-AGENT</div></div><div id="status" class="chip">● READY</div></header>
  <div id="sys"></div>
  <main>
    <section id="left"><div id="transcript" class="card"></div>
      <div id="chatrow" class="hide"><input id="chat" placeholder="$ type a command..." autocomplete="off"><button id="send" class="btn sm">EXEC</button></div></section>
    <section id="center"><canvas id="stage"></canvas>
      <div id="controls"><button id="abort" class="btn red sm">[ ABORT ]</button>
        <button id="mic" aria-label="Microphone"><svg viewBox="0 0 100 100" width="44" height="44"><rect x="41" y="22" width="18" height="34" rx="9" fill="#021008"/><path d="M30 46a20 20 0 0 0 40 0M50 66v14M40 80h20" stroke="#021008" stroke-width="5" fill="none" stroke-linecap="round"/></svg></button>
        <button id="lang" class="btn ghost sm" title="Switch voice language">EN</button></div></section>
    <aside id="right"><div id="news" class="card"></div><div id="tasks" class="card"></div></aside>
  </main>
</div>
<div class="scan"></div><div id="boot"></div><div id="modal" class="hide"></div>
<script src="app.js"></script></body></html>
